name: Reloj
# Cada vuelta revisa las apuestas cada 5 min durante ~5h45m y al terminar lanza la siguiente.
# El horario programado es solo respaldo (GitHub a veces no lo dispara).
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
concurrency: reloj
permissions:
  actions: write
jobs:
  tic:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Revisar apuestas cada 5 min
        # Solo imprime el codigo HTTP: los registros de un repo publico son publicos
        run: |
          end=$((SECONDS + 345 * 60)); fallas=0; avisado=0
          while [ $SECONDS -lt $end ]; do
            code=$(curl -sS -m 90 -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $NOTIFY_SECRET" "$SITE_URL/api/notify" || true)
            echo "$(date -u +%H:%M) $code"
            if [ "$code" = "200" ]; then fallas=0; else fallas=$((fallas + 1)); fi
            if [ $fallas -ge 3 ] && [ $avisado = 0 ]; then
              avisado=1
              curl -sS -m 10 -o /dev/null -X POST "https://panel3r2ores.atiktechmx.com/api/errors" \
                -H "Content-Type: application/json" -H "x-api-key: $PHROUROS_API_KEY" \
                -d "{\"level\":\"ERROR\",\"message\":\"El reloj no puede revisar las apuestas (HTTP $code)\",\"context\":{\"run\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}}" || true
            fi
            sleep 300
          done
        env:
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
          PHROUROS_API_KEY: ${{ secrets.PHROUROS_API_KEY }}
      - name: Lanzar la siguiente vuelta
        if: ${{ !cancelled() }}
        run: gh workflow run reloj.yml -R "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
